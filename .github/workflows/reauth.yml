name: ChatGPT reauthentication

on:
  pull_request:
    paths:
      - 'apps/ios/**'
      - 'apps/parity/**'
      - '.github/workflows/reauth.yml'
  push:
    branches: [main, fix/chatgpt-phone-reauth]
    paths:
      - 'apps/ios/**'
      - 'apps/parity/**'
      - '.github/workflows/reauth.yml'
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Optional source revision for a baseline regression comparison'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: reauth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-recovery:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Select an available iPhone simulator
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output([
              'xcrun', 'simctl', 'list', 'devices', 'available', '--json'
          ]))['devices']
          iphones = [d for runtime, group in devices.items() if 'iOS' in runtime
                     for d in group if d['name'].startswith('iPhone')]
          if not iphones:
              raise SystemExit('No iPhone simulator is installed')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('IOS_SIMULATOR_ID=' + iphones[0]['udid'] + '\n')
          PY
      - name: Build app and run recovery regressions
        working-directory: apps/ios
        run: |
          xcodebuild -project Harness.xcodeproj -scheme Harness \
            -configuration Release \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" \
            -resultBundlePath "$RUNNER_TEMP/reauth-tests.xcresult" \
            -only-testing:HarnessTests/AgentReauthenticationTests \
            -only-testing:HarnessTests/GeneratedImageTests \
            -only-testing:HarnessTests/VisualRuntimeTests \
            -only-testing:HarnessTests/BrandMarkTests \
            -only-testing:HarnessTests/ParityTests \
            -only-testing:HarnessTests/PerfMonitorTests \
            -only-testing:HarnessTests/PerfResourcesTests \
            -only-testing:HarnessTests/PerfOTLPTests \
            -only-testing:HarnessTests/PerfFramesTests \
            -only-testing:HarnessTests/LivePerfTests \
            ENABLE_TESTABILITY=YES CODE_SIGNING_ALLOWED=NO test
      # The layout probes and scroll matrix are intentionally DEBUG-only.
      # Keep this separate from the Release diagnostics/privacy regressions.
      - name: Run transcript scroll matrix
        working-directory: apps/ios
        run: |
          xcodebuild -project Harness.xcodeproj -scheme Harness \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" \
            -resultBundlePath "$RUNNER_TEMP/scroll-matrix-tests.xcresult" \
            -only-testing:HarnessTests/TranscriptScrollMatrixTests \
            -only-testing:HarnessTests/TextSelectionTests \
            CODE_SIGNING_ALLOWED=NO test
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reauth-ios-test-results
          path: |
            ${{ runner.temp }}/reauth-tests.xcresult
            ${{ runner.temp }}/scroll-matrix-tests.xcresult
          if-no-files-found: ignore
