name: tui-release

# Build the terminal UI (tui/) and attach it to a release.
#   - macOS (Apple silicon) and Linux (x86_64 + aarch64) tarballs via tui/package.sh, each with
#     a <tarball>.sha256 that `graff tui` checks before installing it
# The app release workflow (release.yml) calls this after publish so every tagged
# release ships TUI tarballs; a failure here cannot hold up the app release
# (it runs last, and the app artifacts are already uploaded).
#
# Run it standalone after a release is published:
#   gh workflow run tui-release.yml -f tag=v<version>
# With no tag it builds and keeps the tarballs as workflow artifacts only; a pull
# request that touches tui/ builds the same way, so the package stays buildable.

on:
  pull_request:
    paths: ["tui/**", ".github/workflows/tui-release.yml"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the tarballs to (empty: artifacts only)"
        required: false
        default: ""
  workflow_call:
    inputs:
      tag:
        description: "Release tag to attach the tarballs to (empty: artifacts only)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest # Apple silicon
          - runner: ubuntu-24.04 # x86_64
          - runner: ubuntu-24.04-arm # aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config libssl-dev libcap-dev cmake netcat-openbsd
      - name: rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            tui/bridge
            tui/launcher
      - name: package
        run: tui/package.sh
      - name: smoke test the tarball
        run: |
          (cd tui/dist && { sha256sum -c ./*.sha256 2>/dev/null || shasum -a 256 -c ./*.sha256; })
          mkdir smoke && tar -xzf tui/dist/*.tar.gz -C smoke
          CODEX_HOME="$RUNNER_TEMP/codex-home" smoke/*/bin/harness-tui --version
          CODEX_HOME="$RUNNER_TEMP/codex-home" smoke/*/bin/graff-tui --version
      - uses: actions/upload-artifact@v4
        with:
          name: tui-${{ runner.os }}-${{ runner.arch }}
          path: |
            tui/dist/*.tar.gz
            tui/dist/*.tar.gz.sha256
          if-no-files-found: error
      - name: attach to release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" tui/dist/*.tar.gz tui/dist/*.tar.gz.sha256 --clobber
