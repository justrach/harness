name: android release build

run-name: Android release build from ${{ github.ref_name }} by @${{ github.actor }}

# Builds a release bundle and a signed, installable APK to download from the run. It does not publish:
# there is no Play Store step, and uploading the bundle stays a manual, deliberate action.
#
# Signing is optional. With the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and
# ANDROID_KEY_PASSWORD repository secrets the bundle is signed with the release key; without them the bundle
# is built unsigned and the APK is signed with the debug key, which is fine for trying a build on a device.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/android
    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: "ndk;27.1.12297006"
      - uses: ./.github/actions/android-native
      - uses: gradle/actions/setup-gradle@v4

      - name: Release keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No release keystore is configured; the bundle will be unsigned."
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Test before building
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build the release bundle and APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:bundleRelease :app:assemblePerf

      - name: Say what was built
        run: |
          {
            echo "### Android build ${ANDROID_VERSION_CODE}"
            echo "- commit: \`${GITHUB_SHA::12}\`"
            echo "- bundle: $([ '${{ steps.keystore.outputs.signed }}' = true ] && echo 'signed with the release key' || echo 'unsigned (no release keystore configured)')"
            echo "- APK: signed with the debug key, for trying on a device"
            echo "- not uploaded anywhere: download both from this run's artifacts"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ github.run_number }}
          path: |
            apps/android/app/build/outputs/bundle/release/app-release.aab
            apps/android/app/build/outputs/apk/perf/app-perf.apk
          retention-days: 30
