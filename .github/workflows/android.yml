name: android

on:
  pull_request:
    paths:
      - "apps/android/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          # The action's default `tools` package no longer exists in the SDK repository, which
          # made sdkmanager exit 1. Gradle fetches the platform it needs once licenses are accepted.
          packages: ""
      - uses: gradle/actions/setup-gradle@v4
      - name: unit tests and debug build
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
