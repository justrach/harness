name: android

# Build and test the Android app. Nothing here publishes: the release workflow builds a bundle to download,
# and uploading to the Play Store stays a manual step.

on:
  pull_request:
    paths:
      - "apps/android/**"
      # The shared parity vectors and the bundled theme catalog the Android tests read.
      - "apps/parity/**"
      - "apps/ios/Harness/Theme/themes.json"
      # The native core and the crates it is built from.
      - "crates/mobile/**"
      - "crates/doc/**"
      - "crates/sync/**"
      - "crates/proto/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/actions/android-native/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - "apps/parity/**"
      - "apps/ios/Harness/Theme/themes.json"
      - "crates/mobile/**"
      - "crates/doc/**"
      - "crates/sync/**"
      - "crates/proto/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/actions/android-native/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/android

jobs:
  test:
    name: unit tests, lint and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          # The action's default `tools` package no longer exists in the SDK repository, which made
          # sdkmanager exit 1. Gradle fetches the platform it needs once licenses are accepted; the NDK links the
          # native core and must match `ndkVersion` in app/build.gradle.kts.
          packages: "ndk;27.1.12297006"
      - uses: ./.github/actions/android-native
      - uses: gradle/actions/setup-gradle@v4
      # The unit tests include the parity tests: the shared vectors, the UX contract and the bundled theme catalog.
      - name: Unit tests, lint and debug build
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            apps/android/app/build/reports/tests
            apps/android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  release-build:
    name: release-like build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: "ndk;27.1.12297006"
      - uses: ./.github/actions/android-native
      - uses: gradle/actions/setup-gradle@v4
      # Minified with R8, like a store build. `perf` is the same code signed with the debug key so it installs.
      - name: Perf APK and release bundle
        run: ./gradlew --no-daemon :app:assemblePerf :app:bundleRelease
      - name: The baseline profile ships in the APK
        run: unzip -l app/build/outputs/apk/perf/app-perf.apk | grep -q 'assets/dexopt/baseline.prof'
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-build
          path: |
            apps/android/app/build/outputs/apk/perf/app-perf.apk
            apps/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7

  emulator:
    name: instrumented tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: "ndk;27.1.12297006"
      - uses: ./.github/actions/android-native
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM for the emulator
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Hosted emulators sometimes lose the device mid-run. One retry on a fresh emulator tells that apart from a real
      # failure: a broken test fails both attempts.
      - name: Instrumented tests
        id: first
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # The Android Test Device image is the light, CI-oriented one: the full Google APIs image is slow to
          # recreate an activity on a two-core hosted runner.
          api-level: 33
          arch: x86_64
          target: aosp_atd
          profile: Nexus 6
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          working-directory: apps/android
          # The emulator is x86_64, so only that ABI of the native core is built.
          script: ./gradlew --no-daemon -Pharness.abis=x86_64 :app:connectedDebugAndroidTest
      - name: Instrumented tests (one retry on a fresh emulator)
        if: steps.first.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # The Android Test Device image is the light, CI-oriented one: the full Google APIs image is slow to
          # recreate an activity on a two-core hosted runner.
          api-level: 33
          arch: x86_64
          target: aosp_atd
          profile: Nexus 6
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          working-directory: apps/android
          # The emulator is x86_64, so only that ABI of the native core is built.
          script: ./gradlew --no-daemon -Pharness.abis=x86_64 :app:connectedDebugAndroidTest
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumented-reports
          path: apps/android/app/build/reports/androidTests
          if-no-files-found: ignore
          retention-days: 7
