name: UI tests

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'protocol/**'
      - 'scripts/test-linux-browser.sh'
      - 'scripts/heavy-build.sh'
      - 'scripts/test-heavy-build.py'
      - 'scripts/run-macos-browser-fixture.sh'
      - 'dist/macos/Info.plist'
      - 'apps/ios/**'
      - 'apps/parity/**'
      - '.github/workflows/ui-tests.yml'
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'protocol/**'
      - 'scripts/test-linux-browser.sh'
      - 'scripts/heavy-build.sh'
      - 'scripts/test-heavy-build.py'
      - 'scripts/run-macos-browser-fixture.sh'
      - 'dist/macos/Info.plist'
      - 'apps/ios/**'
      - 'apps/parity/**'
      - '.github/workflows/ui-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  session-sync-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/kache
        with:
          access-key-id: ${{ secrets.KACHE_S3_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.KACHE_S3_SECRET_ACCESS_KEY }}
          endpoint: ${{ secrets.KACHE_S3_ENDPOINT }}
          manifest-key: ${{ github.job }}-${{ strategy.job-index }}
      - name: OpenCode protocol and permission regressions
        run: |
          cargo test --locked -p harness-adapters --lib opencode::
          cargo test --locked -p harness-adapters --test opencode
      - name: Build queue signals and run attribution
        run: |
          python3 scripts/test-heavy-build.py
          cargo test --locked -p harness-proto --lib build_wait_
          cargo test --locked -p harness-adapters --lib run_environment::tests
          cargo test --locked -p harness-adapters --test claude build_wait_environment_is_scoped_to_the_launched_run
      - name: Durable session publication and recovery
        run: |
          cargo test --locked -p harness-sync --lib
          cargo test --locked -p harness-sync --test chat2_vectors
          cargo test --locked -p harness-update --lib
          cargo test --locked -p harness-engine --lib --test e2e --test session_publication --test restart_resume --test orphaned_steers --test acp_orphaned_steers --test codex_subagents --test local_profiles --test diff_sync_idle --test build_wait --test show_visual --test branch_drift --test graff_worktree_run --test m5c_accounts_uploads_titles --test worktree_on_run --test graff_login
      - name: graff trace observer
        run: cargo test --locked -p harness-observe
      - name: Desktop parity vectors (protocol/desktop, shared with apps/nano)
        run: |
          cargo test --locked -p harness-proto --test desktop_vectors
          cargo test --locked -p harness-doc --test desktop_transcript_vectors
          cargo test --locked -p harness-theme --test desktop_theme_vectors
          cargo test --locked -p harness-engine --test desktop_requests

  ui-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype-dev libasound2-dev \
            libvulkan-dev pkg-config cmake libwebkit2gtk-4.1-dev libjson-glib-dev
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Nano UI and headless layout regressions
        working-directory: apps/nano
        run: zig build test --summary all

  macos-frame-recovery:
    name: macos-frame-recovery
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Check macOS application
        run: cargo check --release --locked -p harness
      - name: Nano UI macOS tests
        working-directory: apps/nano
        run: zig build test --summary all

  ios-tests:
    # Skipped for now: the iOS app isn't shipping yet and this job fails.
    # Remove this line to run it again.
    if: false
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select an available iPhone simulator
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "--json"]))["devices"]
          iphones = [device for runtime, group in devices.items() if "iOS" in runtime
                     for device in group if device["name"].startswith("iPhone")]
          if not iphones:
              raise SystemExit("No iPhone simulator is installed")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("IOS_SIMULATOR_ID=" + iphones[0]["udid"] + "\n")
          PYTHON
      - name: Run iOS unit tests
        working-directory: apps/ios
        run: |
          xcodebuild -project Harness.xcodeproj -scheme Harness \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" \
            -resultBundlePath "$RUNNER_TEMP/ios-tests.xcresult" \
            -only-testing:HarnessTests CODE_SIGNING_ALLOWED=NO test
      - name: Upload iOS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/ios-tests.xcresult
          if-no-files-found: ignore
