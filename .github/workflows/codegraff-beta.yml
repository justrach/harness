name: Codegraff beta GUI

# The dispatch is an immediate hint. The schedule also picks up beta releases
# when the caller has no cross-repository workflow token.
on:
  repository_dispatch:
    types: [codegraff_release_published]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codegraff-beta-gui
  cancel-in-progress: false

jobs:
  macos:
    if: github.event_name != 'repository_dispatch' || github.event.client_payload.channel == 'beta'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Select current published beta
        id: beta
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_BRANCH: ${{ github.event.client_payload.branch }}
          EXPECTED_SHA: ${{ github.event.client_payload.sha }}
          EXPECTED_TAG: ${{ github.event.client_payload.tag }}
        run: python3 scripts/codegraff-beta.py
      - name: Check for an existing build
        if: steps.beta.outputs.tag != ''
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .beta-sync-cache
          key: codegraff-beta-macos-${{ steps.beta.outputs.tag }}-${{ github.sha }}
      - name: Download and verify exact beta CLI
        if: steps.beta.outputs.tag != '' && steps.cache.outputs.cache-hit != 'true'
        id: graff
        env:
          BETA_TAG: ${{ steps.beta.outputs.tag }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          dir="$RUNNER_TEMP/codegraff-beta"
          mkdir -p "$dir"
          base="https://github.com/justrach/codegraff/releases/download/$BETA_TAG"
          asset=graff-aarch64-macos.tar.gz
          curl -fsSL "$base/$asset" -o "$dir/$asset"
          curl -fsSL "$base/SHA256SUMS" -o "$dir/SHA256SUMS"
          awk -v name="$asset" '$2 == name {print}' "$dir/SHA256SUMS" >"$dir/selected.sha256"
          test "$(wc -l <"$dir/selected.sha256" | tr -d ' ')" = 1
          (cd "$dir" && shasum -a 256 -c selected.sha256)
          tar -xzf "$dir/$asset" -C "$dir"
          test -x "$dir/graff-aarch64-macos/graff"
          echo "binary=$dir/graff-aarch64-macos/graff" >>"$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        if: steps.beta.outputs.tag != '' && steps.cache.outputs.cache-hit != 'true'
      - name: Build intermediate beta GUI
        if: steps.beta.outputs.tag != '' && steps.cache.outputs.cache-hit != 'true'
        env:
          GRAFF_BINARY: ${{ steps.graff.outputs.binary }}
        run: |
          rustup show active-toolchain || rustup toolchain install
          scripts/package-macos.sh
          test -f target/package/zeron-*-macos-arm64-app.tar.gz
      - name: Record included revisions
        if: steps.beta.outputs.tag != '' && steps.cache.outputs.cache-hit != 'true'
        env:
          BETA_TAG: ${{ steps.beta.outputs.tag }}
          BETA_SHA: ${{ steps.beta.outputs.sha }}
          BETA_BRANCH: ${{ steps.beta.outputs.branch }}
        run: |
          printf 'codegraff_tag=%s\ncodegraff_sha=%s\ncodegraff_branch=%s\nharness_sha=%s\n' \
            "$BETA_TAG" "$BETA_SHA" "$BETA_BRANCH" "$GITHUB_SHA" \
            > target/package/codegraff-beta.txt
      - name: Recheck current release branch
        if: steps.beta.outputs.tag != '' && steps.cache.outputs.cache-hit != 'true'
        id: fresh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_BRANCH: ${{ steps.beta.outputs.branch }}
          EXPECTED_SHA: ${{ steps.beta.outputs.sha }}
          EXPECTED_TAG: ${{ steps.beta.outputs.tag }}
        run: python3 scripts/codegraff-beta.py
      - name: Upload intermediate app only
        if: steps.fresh.outputs.tag == steps.beta.outputs.tag && steps.beta.outputs.tag != ''
        uses: actions/upload-artifact@v4
        with:
          name: harness-macos-${{ steps.beta.outputs.tag }}-${{ github.sha }}
          path: |
            target/package/zeron-*-macos-arm64-app.tar.gz
            target/package/codegraff-beta.txt
          if-no-files-found: error
          retention-days: 7
      - name: Remember completed build
        if: steps.fresh.outputs.tag == steps.beta.outputs.tag && steps.beta.outputs.tag != ''
        run: mkdir -p .beta-sync-cache && printf '%s\n' '${{ steps.beta.outputs.tag }}' >.beta-sync-cache/tag
      - name: Cache completed build marker
        if: steps.fresh.outputs.tag == steps.beta.outputs.tag && steps.beta.outputs.tag != ''
        uses: actions/cache/save@v4
        with:
          path: .beta-sync-cache
          key: codegraff-beta-macos-${{ steps.beta.outputs.tag }}-${{ github.sha }}
