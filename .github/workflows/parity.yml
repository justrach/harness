name: parity

# The Swift half of the iOS/Android parity guard. The Kotlin half runs in the android workflow. The full iOS unit
# suite is switched off in ui-tests.yml, so this runs only the parity tests: they read apps/parity and the SwiftUI
# sources, and fail when either app moves away from the shared rules and copy.

on:
  pull_request:
    paths:
      - "apps/parity/**"
      - "protocol/**"
      - "apps/ios/**"
      - ".github/workflows/parity.yml"
  push:
    branches: [main]
    paths:
      - "apps/parity/**"
      - "protocol/**"
      - "apps/ios/**"
      - ".github/workflows/parity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      label: ${{ steps.pick.outputs.label }}
    steps:
      - id: pick
        env:
          HEARTBEAT: ${{ vars.HARNESS_MAC_HEARTBEAT }}
          SAME_REPO: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          now=$(date +%s)
          if [ "$SAME_REPO" = "true" ] && [[ "$HEARTBEAT" =~ ^[0-9]+$ ]] && [ $((now - HEARTBEAT)) -lt 150 ]; then
            echo "label=harness-macos-arm64" >> "$GITHUB_OUTPUT"
            echo "Routing macOS job to local M3 worker (heartbeat $((now - HEARTBEAT))s old)"
          else
            echo "label=macos-latest" >> "$GITHUB_OUTPUT"
            echo "Routing macOS job to GitHub cloud macos-latest (same_repo=$SAME_REPO, heartbeat=${HEARTBEAT:-unset})"
          fi

  ios-parity:
    needs: macos-runner
    runs-on: ${{ needs.macos-runner.outputs.label || 'macos-latest' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Select an available iPhone simulator
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "--json"]))["devices"]
          iphones = [device for runtime, group in devices.items() if "iOS" in runtime
                     for device in group if device["name"].startswith("iPhone")]
          if not iphones:
              raise SystemExit("No iPhone simulator is installed")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("IOS_SIMULATOR_ID=" + iphones[0]["udid"] + "\n")
          PYTHON
      - name: Parity tests
        working-directory: apps/ios
        run: |
          ../../scripts/heavy-build.sh xcodebuild -project Harness.xcodeproj -scheme Harness \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" \
            -resultBundlePath "$RUNNER_TEMP/parity.xcresult" \
            -only-testing:HarnessTests/ParityTests \
            -only-testing:HarnessTests/Chat2VectorTests CODE_SIGNING_ALLOWED=NO test
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-test-results
          path: ${{ runner.temp }}/parity.xcresult
          if-no-files-found: ignore
          retention-days: 7
