name: Windows tests

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'apps/harness/**'
      - 'dist/windows/**'
      - 'crates/**'
      - 'scripts/test-windows-*.ps1'
      - 'scripts/package-windows.ps1'
      - '.github/workflows/windows.yml'
      - '.github/actions/windows-rust/**'
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'apps/harness/**'
      - 'dist/windows/**'
      - 'crates/**'
      - 'scripts/test-windows-*.ps1'
      - 'scripts/package-windows.ps1'
      - '.github/workflows/windows.yml'
      - '.github/actions/windows-rust/**'
  workflow_dispatch:
    inputs:
      native_gui:
        description: 'Run native GUI/pixel probes (requires a usable desktop and Direct3D)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  # The suites run as three parallel groups of about equal length instead of
  # one serial job: each group compiles only what its tests need, on its own
  # runner and cache. `tests` below is the single check that passes only when
  # all three do.
  ui:
    name: tests (ui)
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/windows-rust
      - name: UI tests
        env:
          RUST_BACKTRACE: '1'
        run: |
          # Native platform initialization runs in its own process. Keep the
          # real-font assertion and the complete headless suite mandatory.
          cargo test --release --locked -p harness-ui --lib native_diff_font_geometry -- --test-threads=1 --nocapture
          $nativeResult = $LASTEXITCODE
          cargo test --release --locked -p harness-ui --lib -- --test-threads=1 --skip native_diff_font_geometry --nocapture
          $headlessResult = $LASTEXITCODE
          if ($nativeResult -ne 0 -or $headlessResult -ne 0) { exit 1 }

  app:
    name: tests (app and packaging)
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/windows-rust
      - name: Build application
        run: cargo build --release --locked -p harness
      - name: Verify portable packaging
        run: ./scripts/package-windows.ps1 -ReleasesUrl "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download"
      - name: Shader layout tests
        run: cargo test --release --locked -p gpui_windows --lib layout
      - name: Application and updater tests
        run: cargo test --release --locked -p harness -p harness-update -p harness-observe
      - name: GUI subsystem and redirected CLI output
        run: ./scripts/test-windows-startup.ps1
      - name: CLI startup without HOME
        run: |
          # Exercise real path resolution without touching the runner's account.
          # Port zero cannot connect to another running engine.
          $env:HOME = $null
          $env:HARNESS_DATA_DIR = $null
          $env:HARNESS_EDGE_TOKEN = $null
          $env:HARNESS_IPC_PORT = '0'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "harness smoke O'Brien 日本語"
          $expected = Join-Path $env:LOCALAPPDATA 'Harness'
          $probe = [Diagnostics.ProcessStartInfo]::new()
          $probe.FileName = (Resolve-Path -LiteralPath './target/release/harness.exe').Path
          $probe.Arguments = 'status'
          $probe.UseShellExecute = $false
          $probe.CreateNoWindow = $true
          $probe.RedirectStandardOutput = $true
          $probe.RedirectStandardError = $true
          $process = [Diagnostics.Process]::Start($probe)
          try {
            $stdout = $process.StandardOutput.ReadToEndAsync()
            $stderr = $process.StandardError.ReadToEndAsync()
            if (-not $process.WaitForExit(10000)) {
              $process.Kill()
              throw 'Isolated status probe timed out'
            }
            if ($process.ExitCode -ne 0) { throw "Status failed: $($stderr.Result)" }
            $output = $stdout.Result -split '\r?\n'
          } finally { $process.Dispose() }
          $output
          if (-not ($output -contains "Data dir: $expected")) {
            throw 'Windows startup did not select LOCALAPPDATA/Harness'
          }
          if (-not ($output -match '^Mode:\s+local only$')) {
            throw 'An isolated Windows startup must select local-only mode'
          }
      - name: Build rendering fixture
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.native_gui }}
        run: cargo build --release --locked -p harness-ui --example windows-render-fixture --features windows-render-fixture
      - name: Upload GUI test binaries
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.native_gui }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-gui-binaries
          path: |
            target/release/harness.exe
            target/release/examples/windows-render-fixture.exe
          if-no-files-found: error
          retention-days: 1

  engine:
    name: tests (engine and adapters)
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/windows-rust
      - name: Native harness security and integration tests
        run: cargo test --release --locked -p harness-adapters --features native-fixture --lib --test codex_availability --test windows_native
      - name: Codegraff sign-in finds a home without HOME
        run: |
          # A stock Windows session has no HOME; the key file must land in USERPROFILE.
          Remove-Item Env:HOME -ErrorAction SilentlyContinue
          cargo test --release --locked -p harness-engine --lib codegraff_auth::tests
      - name: Engine unit tests
        run: cargo test --release --locked -p harness-engine --lib
      - name: Harness catalog and login tests
        run: cargo test --release --locked -p harness-engine --test codex_catalog --test codex_login_resolution
      - name: Auth integration tests
        run: cargo test --release --locked -p harness-engine --test auth

  tests:
    if: ${{ always() }}
    needs: [ui, app, engine]
    runs-on: ubuntu-latest
    steps:
      - name: All Windows test groups passed
        shell: bash
        run: |
          for result in "${{ needs.ui.result }}" "${{ needs.app.result }}" "${{ needs.engine.result }}"; do
            [ "$result" = success ] || { echo "a Windows test group ended: $result"; exit 1; }
          done

  native-gui:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.native_gui }}
    needs: app
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-gui-binaries
          path: target/release
      - name: App lifecycle tests
        run: ./scripts/test-windows-lifecycle.ps1
      - name: Rendering tests
        run: ./scripts/test-windows-rendering.ps1
      - name: Upload GUI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-probes
          path: |
            target/windows-render-*/capture.png
            target/windows-render-*/measurements.json
            target/windows-render-*/stdout.txt
            target/windows-render-*/stderr.txt
            target/windows-lifecycle-*/result.txt
            target/windows-lifecycle-*/run-*.txt
          if-no-files-found: warn
