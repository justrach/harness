name: deploy

# Deploy Harness landing assets. The sync Worker is built in
# /zigrepper/services/harness-edge and has its own deployment process.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  # Static Harness landing page — assets-only worker, no build step.
  landing:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: detect landing changes
        id: changed
        shell: bash
        run: |
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
            || [ -z "$before" ] || ! git cat-file -e "$before" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$before" "$GITHUB_SHA" | grep -qE "^(apps/landing/|\.github/workflows/deploy\.yml)"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.changed.outputs.changed == 'true'
        with:
          node-version: 22
      - name: test
        if: steps.changed.outputs.changed == 'true'
        working-directory: apps/landing
        run: node --test *.test.mjs
      - name: deploy
        if: steps.changed.outputs.changed == 'true' && env.CLOUDFLARE_API_TOKEN != ''
        working-directory: apps/landing
        run: npx wrangler@4 deploy

  # Optional www host canonicalization (see apps/www-redirect/wrangler.jsonc).
  www-redirect:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: detect www-redirect changes
        id: changed
        shell: bash
        run: |
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
            || [ -z "$before" ] || ! git cat-file -e "$before" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$before" "$GITHUB_SHA" | grep -qE "^(apps/www-redirect/|\.github/workflows/deploy\.yml)"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.changed.outputs.changed == 'true'
        with:
          node-version: 22
      - name: deploy
        if: steps.changed.outputs.changed == 'true' && env.CLOUDFLARE_API_TOKEN != ''
        working-directory: apps/www-redirect
        run: npx wrangler@4 deploy
