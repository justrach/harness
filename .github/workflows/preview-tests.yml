name: Preview networking
on:
  pull_request:
    paths: ['crates/preview/**', 'crates/proto/**', 'Cargo.toml', 'Cargo.lock', 'edge/**', 'protocol/**', '.github/workflows/preview-tests.yml']
  push:
    branches: [main]
    paths: ['crates/preview/**', 'crates/proto/**', 'Cargo.toml', 'Cargo.lock', 'edge/**', 'protocol/**', '.github/workflows/preview-tests.yml']
permissions:
  contents: read
concurrency:
  group: preview-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      preview_rust: ${{ steps.scope.outputs.preview_rust }}
      preview_edge: ${{ steps.scope.outputs.preview_edge }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        run: |
          python3 scripts/ci-changed-scopes.py \
            --event-name "${{ github.event_name }}" \
            --base "${{ github.event.pull_request.base.sha || github.event.before }}" \
            --head "${{ github.event.pull_request.head.sha || github.sha }}" \
            --github-output "$GITHUB_OUTPUT"

  networking:
    needs: changes
    if: needs.changes.outputs.preview_rust == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/kache
        with:
          access-key-id: ${{ secrets.KACHE_S3_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.KACHE_S3_SECRET_ACCESS_KEY }}
          endpoint: ${{ secrets.KACHE_S3_ENDPOINT }}
          manifest-key: ${{ github.job }}-${{ strategy.job-index }}
      - run: cargo test --locked -p harness-preview
  coordinator:
    needs: changes
    if: needs.changes.outputs.preview_edge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: edge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: edge/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
