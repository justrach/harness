[workspace]
resolver = "2"
members = [
    "crates/theme",
    "crates/proto",
    "crates/preview",
    "crates/doc",
    "crates/sync",
    "crates/harness",
    "crates/engine",
    "crates/rpc",
    "crates/update",
    "crates/ui",
    "crates/syntax",
    "crates/mcp",
    "apps/harness",
]
# Vendored forks are their own (trimmed) workspaces.
exclude = ["vendor/zui", "vendor/gpui-component"]

[workspace.package]
version = "0.2.88"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
harness-proto = { path = "crates/proto" }
harness-preview = { path = "crates/preview" }
harness-doc = { path = "crates/doc" }
harness-sync = { path = "crates/sync" }
harness-adapters = { path = "crates/harness" }
harness-engine = { path = "crates/engine" }
harness-rpc = { path = "crates/rpc" }
harness-update = { path = "crates/update" }
harness-ui = { path = "crates/ui" }
harness-syntax = { path = "crates/syntax" }
harness-theme = { path = "crates/theme" }
harness-mcp = { path = "crates/mcp" }

# CRDT
loro = "1.13"
# Wire protocol for the SessionRoom DO rooms — official Rust twin of the npm
# `loro-protocol` package the TS edge speaks (same monorepo, byte-identical
# frames, cross-checked by its js_snapshots tests).
loro-protocol = "0.3"

# gpui — vendored Zui, extracted from wingleeio/zed e2ddcc6 with identical
# crate sources; adds bounded blur passes and shared Gaussian weights.
# Removes GPL tracing crates and composites deferred GPUI content above native macOS views.
# Preserved fork history: upstream f14fea9 + commits on
# `comet/edge-fade-horizontal` (tip of `comet/line-wrap-closing-punctuation`
# + 5d1f83d horizontal per-pixel EdgeFade for quads/images; rebase when bumping the
# upstream rev): a6bf17c fixes BOTH wrap-rule copies (LineWrapper +
# line_layout's shaped-text duplicate); 14baea0 adds the EdgeFade primitive
# (Window::with_edge_fade — per-primitive scroll-edge fades for the glass
# sidebar); a6c1ad5 adds BackdropBlur + horizontal EdgeFade + glass fixes;
# 9b672fa bounds renderer GPU memory (region-sized backdrop blur scratch,
# idle release of blur/path intermediates, instance pool shrink,
# HARNESS_GPU_STATS=1 diagnostics); b687328 adds ImageSource::evict (frees
# sprite-atlas tiles — remove_asset alone leaked them, see
# attachments::flush_evicted); ac135eb adds device memory to the stats line;
# f596cde fixes destination alpha on transparent windows (Porter-Duff OVER,
# not additive); 53518c0 merges the edge-fade line: per-edge fade bands +
# per-pixel EdgeFade for quads/images (true fade-into-glass), and
# object-fit Cover cropping via atlas-tile UVs so image corner radii hold;
# 8a8954c switches the macOS blurred view to UnderWindowBackground (macOS 26
# stopped vending CABackdropLayer for Selection — window blur went dead);
# b68970e rasterizes BackdropBlur in the wgpu renderer (frosted floats on
# Linux — the Metal path's snapshot/blur/composite, ported).
# Paint-time rounded image masks (#9), bounded Windows backdrop blur and
# translucent compositing, plus blur-aware scene batching (#10).
#
# Harness vendors both forks (Apache-2.0; see vendor/README.md): zui at
# gaelcado/zui 53869c2 (the text-fade patch harness pinned on top of
# the pinned Zui revision c2d273d) and gpui-base from the pinned gpui-component revision 03cd994.
gpui = { path = "vendor/zui/crates/gpui" }
gpui_platform = { path = "vendor/zui/crates/gpui_platform", features = [
    "wayland",
    "x11",
    "font-kit",
    "runtime_shaders",
] }
gpui_tokio = { path = "vendor/zui/crates/gpui_tokio" }
gpui-base = { path = "vendor/gpui-component/crates/base" }

# diffs
similar = "2"

# async / net
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
libc = "0.2"
gethostname = "1"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures = "0.3"
async-trait = "0.1"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "0.4"
# antigravity writes `settings.json` but reads it back with `hjson.load`, so a
# user's comments and unquoted keys have to survive our read of the same file.
deser-hjson = "2.2"
plist = "1"
uuid = { version = "1", features = ["v4", "serde"] }

# storage
rusqlite = { version = "0.32", features = ["bundled"] }

# misc
# Global allocator on macOS only: libmalloc retains the churn high-water mark
# as permanent RSS - measured as the top residency cause in
# docs/memory-plan.md. Pinned to mimalloc v2: the crate's default (v3.3.2)
# has the same watermark pathology itself - transient streaming/render churn
# became permanent RSS (~6x glibc growth, daemon at 908MB for 7.3MB of docs,
# no idle recovery). Linux stays on glibc, which measured flat on the same
# workloads.
mimalloc = { version = "0.1", features = ["v2"] }
anyhow = "1"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
zip = { version = "7.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
notify = "7"
portable-pty = "0.8"
alacritty_terminal = "0.26"
pulldown-cmark = "0.12"
unicode-segmentation = "1"
unicode-width = "0.2"
fontdb = "0.23"
ttf-parser = "0.25.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
ignore = "0.4"
nucleo-matcher = "0.3"

[profile.release]
# Distribution profile (scripts/package-linux.sh): thin LTO buys most of fat
# LTO's size/speed win at a fraction of the link time; strip debug symbols.
lto = "thin"
strip = "symbols"

[profile.dev]
# gpui is slow unoptimized; match zed's approach for deps
opt-level = 0

[profile.dev.package."*"]
opt-level = 2

[profile.app-dev]
# The locally run app bundle (scripts/run-macos-dev.sh). Plain `dev` leaves
# the workspace crates unoptimized, which makes every UI frame (layout,
# prepaint, paint) several times more expensive: a streaming agent measured
# 18% CPU there vs ~13% here. Keeps debug assertions and incremental builds.
inherits = "dev"
opt-level = 2
debug = "line-tables-only"
