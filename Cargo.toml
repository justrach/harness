[workspace]
resolver = "2"
members = [
    "crates/theme",
    "crates/proto",
    "crates/preview",
    "crates/visual",
    "crates/doc",
    "crates/sync",
    "crates/harness",
    "crates/engine",
    "crates/rpc",
    "crates/update",
    "crates/syntax",
    "crates/mcp",
    "crates/observe",
    "crates/mobile",
    "apps/harness",
]
# Vendored forks are their own (trimmed) workspaces.
exclude = ["tui"]

[workspace.package]
version = "0.2.191"
edition = "2024"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
harness-proto = { path = "crates/proto" }
harness-preview = { path = "crates/preview" }
harness-visual = { path = "crates/visual" }
harness-doc = { path = "crates/doc" }
harness-sync = { path = "crates/sync" }
harness-adapters = { path = "crates/harness" }
harness-engine = { path = "crates/engine", default-features = false }
harness-rpc = { path = "crates/rpc" }
harness-update = { path = "crates/update" }
harness-syntax = { path = "crates/syntax" }
harness-theme = { path = "crates/theme" }
harness-mcp = { path = "crates/mcp" }
harness-mobile = { path = "crates/mobile" }
harness-observe = { path = "crates/observe" }

# CRDT
loro = "1.13"

# diffs
similar = "2"

# async / net
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs", "io-util", "io-std", "process", "signal"] }
tokio-util = "0.7"
libc = "0.2"
gethostname = "1"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures = "0.3"
async-trait = "0.1"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
json5 = "1"
# antigravity writes `settings.json` but reads it back with `hjson.load`, so a
# user's comments and unquoted keys have to survive our read of the same file.
deser-hjson = "2.2"
plist = "1"
uuid = { version = "1", features = ["v4", "serde"] }

# storage
rusqlite = { version = "0.32", features = ["bundled"] }

# misc
# Global allocator on macOS only: libmalloc retains the churn high-water mark
# as permanent RSS - measured as the top residency cause in
# docs/memory-plan.md. Pinned to mimalloc v2: the crate's default (v3.3.2)
# has the same watermark pathology itself - transient streaming/render churn
# became permanent RSS (~6x glibc growth, daemon at 908MB for 7.3MB of docs,
# no idle recovery). Linux stays on glibc, which measured flat on the same
# workloads.
mimalloc = { version = "0.1", features = ["v2"] }
anyhow = "1"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
zip = { version = "7.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
notify = "7"
portable-pty = "0.8"
pulldown-cmark = { version = "0.12", default-features = false }
# Packaged GUI apps do not inherit shell proxy variables; honor the macOS and
# Windows system proxy for provider usage probes and other HTTP clients.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "system-proxy"] }
ignore = "0.4"
nucleo-matcher = "0.3"

[profile.release]
# Optimized builds, CI's `--release` tests among them: thin LTO buys most of
# fat LTO's size/speed win at a fraction of the link time; strip debug
# symbols.
lto = "thin"
strip = "symbols"

[profile.dist]
# What ships (scripts/package-macos.sh, package-linux.sh, package-arch.sh,
# package-windows.ps1): fat LTO in one codegen unit merges the generic code
# thin LTO leaves duplicated. The macOS app binary measured 101.9 MB with
# `release`, 84.5 MB with this, for a link of about 8 minutes on an M-series
# Mac. Kept out of `release` so CI's release-mode tests stay fast.
inherits = "release"
lto = "fat"
codegen-units = 1

[profile.mobile]
# The Android app's native library (apps/android builds it per ABI). Release
# code, smaller than speed-first: it ships inside every APK.
inherits = "release"
opt-level = "s"

[profile.headless]
# Size-optimized headless daemon build (`cargo build --profile headless -p harness --no-default-features`).
inherits = "dist"
opt-level = "s"

[profile.dev]
# gpui is slow unoptimized; match zed's approach for deps
opt-level = 0

[profile.dev.package."*"]
opt-level = 2

[profile.app-dev]
# The locally run app bundle (scripts/run-macos-dev.sh). Plain `dev` leaves
# the workspace crates unoptimized, which makes every UI frame (layout,
# prepaint, paint) several times more expensive: a streaming agent measured
# 18% CPU there vs ~13% here. Keeps debug assertions and incremental builds.
inherits = "dev"
opt-level = 2
debug = "line-tables-only"
