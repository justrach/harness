[package]
name = "harness-tui"
version = "0.1.0"
edition = "2024"
publish = false
description = "Codex's terminal UI, connected to the Harness bridge instead of Codex's own agent runtime."

[[bin]]
name = "harness-tui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
supports-color = "3.0.2"
toml_edit = "0.23"
codex-arg0 = { path = "../codex/codex-rs/arg0" }
codex-build-info = { path = "../codex/codex-rs/build-info" }
codex-config = { path = "../codex/codex-rs/config" }
codex-tui = { path = "../codex/codex-rs/tui" }
codex-utils-cli = { path = "../codex/codex-rs/utils/cli" }

# Same forks the Codex workspace patches in; without them the TUI does not build.
[patch.crates-io]
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "efa177859fd9623d57b9fe7ae9bf491ae1ac6ec4" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[workspace]
