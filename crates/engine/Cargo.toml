[package]
name = "harness-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
harness-preview.workspace = true
harness-proto.workspace = true
harness-doc.workspace = true
harness-sync.workspace = true
harness-adapters.workspace = true
harness-rpc.workspace = true
harness-update.workspace = true
loro.workspace = true
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
notify.workspace = true
portable-pty.workspace = true
base64 = "0.22"
libc.workspace = true
gethostname.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
sha2.workspace = true
reqwest.workspace = true
ignore.workspace = true
nucleo-matcher.workspace = true
# browse Connected apps (browse_link): P-256 ECDSA request signing.
p256 = { version = "0.13", features = ["ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }

tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# The browse pairing key lives in the login Keychain, not a file.
security-framework = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
harness-adapters = { workspace = true, features = ["installer-fixture"] }
zip.workspace = true
tokio-tungstenite.workspace = true
# In-process registry server for the two-engine workspace integration tests.
harness-sync = { workspace = true, features = ["mock-server"] }
